name: Windows compatibility
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Native VS Code Extension Host
        run: npm run test:extension
        timeout-minutes: 5
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-haness-windows-node-${{ matrix.node }}
          path: '*.vsix'
